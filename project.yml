name: DeadIsland2SaveMac
options:
  bundleIdPrefix: org.darkuser89
  deploymentTarget:
    macOS: '14.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    MARKETING_VERSION: 0.4.1
    CURRENT_PROJECT_VERSION: 8
    SWIFT_INCLUDE_PATHS: '$(SRCROOT)/macOS/NativeCodec'
targets:
  NativeCodec:
    type: library.static
    platform: macOS
    sources:
      - path: macOS/NativeCodec
      - path: macOS/ThirdParty/cityhash
        excludes: [COPYING, config.h]
      - path: macOS/ThirdParty/zstd/lib
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - '$(SRCROOT)/macOS/ThirdParty/cityhash'
          - '$(SRCROOT)/macOS/ThirdParty/zstd/lib'
          - '$(SRCROOT)/macOS/ThirdParty/zstd/lib/common'
        GCC_PREPROCESSOR_DEFINITIONS: '$(inherited) ZSTD_DISABLE_ASM=1'
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        SKIP_INSTALL: YES
  SaveCore:
    type: framework
    platform: macOS
    sources: [macOS/SaveCore]
    dependencies:
      - target: NativeCodec
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.darkuser89.DeadIsland2SaveMac.Core
        GENERATE_INFOPLIST_FILE: YES
        OTHER_SWIFT_FLAGS: '$(inherited) -I $(SRCROOT)/macOS/NativeCodec'
        OTHER_LDFLAGS: '$(inherited) -lc++'
        SKIP_INSTALL: YES
  DeadIsland2SaveMac:
    type: application
    platform: macOS
    sources:
      - path: macOS/SaveMac
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - target: SaveCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.darkuser89.DeadIsland2SaveMac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dead Island 2 Save Mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/../Frameworks'
  SaveMacVerify:
    type: tool
    platform: macOS
    sources: [macOS/Verifier]
    dependencies:
      - target: SaveCore
        embed: false
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path'
  SaveCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [macOS/Tests]
    dependencies:
      - target: SaveCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.darkuser89.DeadIsland2SaveMac.Tests
        OTHER_SWIFT_FLAGS: '$(inherited) -I $(SRCROOT)/macOS/NativeCodec'
schemes:
  SaveMacVerify:
    build:
      targets:
        SaveMacVerify: all
  SaveCore:
    build:
      targets:
        SaveCore: all
    test:
      targets: [SaveCoreTests]
  DeadIsland2SaveMac:
    build:
      targets:
        DeadIsland2SaveMac: all
        SaveMacVerify: all
    test:
      targets: [SaveCoreTests]
      gatherCoverageData: false
